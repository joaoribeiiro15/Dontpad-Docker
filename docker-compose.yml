services:
  openpad:
    build: .
    image: openpad:latest
    # The image is always built locally: do not try to pull it from a registry.
    pull_policy: build
    container_name: openpad
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      APP_NAME: "${APP_NAME:-openpad}"
      DB_PATH: "/data/openpad.db"
      SYNC_INTERVAL_MS: "${SYNC_INTERVAL_MS:-5000}"
      REQUEST_TIMEOUT_MS: "${REQUEST_TIMEOUT_MS:-10000}"
      MAX_BODY_BYTES: "${MAX_BODY_BYTES:-1048576}"
      MAX_DEPTH: "${MAX_DEPTH:-10}"
      RATE_LIMIT_PER_MIN: "${RATE_LIMIT_PER_MIN:-600}"
      MAX_STREAMS_PER_IP: "${MAX_STREAMS_PER_IP:-20}"
      MAX_FILE_BYTES: "${MAX_FILE_BYTES:-10485760}"
      MAX_FILES_PER_PAGE: "${MAX_FILES_PER_PAGE:-20}"
      MAX_FILES_TOTAL_BYTES: "${MAX_FILES_TOTAL_BYTES:-268435456}"
      FILE_TTL_MS: "${FILE_TTL_MS:-21600000}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - openpad-data:/data
    # Read-only container filesystem; only /data (volume) and /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  openpad-data:
