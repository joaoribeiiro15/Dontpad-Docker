<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{{APP_NAME}}</title>
    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/pad.css" />
  </head>
  <body>
    <div class="usable">
      <nav id="menu-div" hidden aria-label="Subpáginas">
        <ul id="menu"></ul>
        <a id="zip" class="zip" href="#" download>Descarregar .zip</a>
      </nav>
      <textarea id="text" disabled spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Texto da página"></textarea>
    </div>

    <div id="status" hidden role="status" aria-live="polite"><img id="status-icon" alt="" width="18" height="18" /></div>
    <div id="message" class="message" hidden role="alert"></div>

    <dialog id="conflict" aria-labelledby="conflict-title">
      <h2 id="conflict-title">Conflito de versões</h2>
      <p>A página foi alterada noutro lado desde a última sincronização.</p>
      <p class="hint">Substituir grava o teu texto por cima da outra versão. Descartar troca o teu texto pela versão do servidor.</p>
      <div class="actions">
        <button id="conflict-discard" type="button">Descartar</button>
        <button id="conflict-override" type="button" class="primary">Substituir</button>
      </div>
    </dialog>

    <script src="/assets/pad.js" type="module"></script>
  </body>
</html>
