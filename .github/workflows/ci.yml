name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unitários e API
        run: npm test
      - name: Ponta a ponta (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openpad:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Teste de fumo ao /healthz
        run: |
          docker run -d --name openpad -p 3000:3000 openpad:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/healthz | grep -q '"status":"ok"'
          curl -fsS -X POST -d text=ola -d lastModified=0 -d force=false http://localhost:3000/api/body/fumo
          curl -fsS "http://localhost:3000/api/body/fumo?lastModified=0" | grep -q '"body":"ola"'
          docker image inspect openpad:ci --format 'Tamanho: {{.Size}} bytes'
          docker logs openpad
          docker rm -f openpad
      - name: Ponta a ponta contra o contentor
        run: |
          docker run -d --name openpad -p 3000:3000 -e RATE_LIMIT_PER_MIN=100000 openpad:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/healthz && break; sleep 1; done
          npm ci
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost:3000 SYNC_INTERVAL_MS=5000 npx playwright test
          docker rm -f openpad
      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Publicar
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
